[project]
name = "epppsynth"
version = "0.0.0"
description = "Local, offline-capable reflection aid — deterministic core library with a CLI."
license = "Apache-2.0"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
epppsynth = "epppsynth.cli:main"

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/epppsynth"]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["tests"]
markers = [
    "requires_index: needs the local derived index; never runs in CI (no-model path, D-42)",
    "requires_model: needs local model weights; never runs in CI (no-model path, D-42)",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
